name: Déploiement GitHub Pages

on:
  push:
    branches: [claude/minecraft-like-web-game-mbzyzm]
  workflow_dispatch:

# Le jeton n'a besoin que de lire le dépôt et d'écrire sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushs rapprochés annulent le précédent.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Serveur de parties multijoueur (Cloudflare Workers). Il ne se déploie que
  # si les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID existent ; son
  # adresse est ensuite donnée au jeu. Un échec ici n'empêche pas de publier
  # le jeu : le multijoueur est simplement indisponible.
  worker:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - id: deploy
        shell: bash
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Secrets Cloudflare absents : multijoueur non déployé."
            exit 0
          fi
          npm ci
          npx tsc --noEmit
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Serveur de parties : ${url:-adresse introuvable}"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  build:
    needs: worker
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      # Adresse du serveur de parties, inscrite dans le jeu à la construction.
      VITE_MP_URL: ${{ needs.worker.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` lance aussi `tsc --noEmit` : le déploiement échoue si
      # le typage casse.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
